<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>小桃养成记 · AI 客服</title>
<style>
  :root {
    --bg: #0f0f1a;
    --card: #1a1a2e;
    --accent: #ffd700;
    --accent2: #c83a6a;
    --text: #e8e8f0;
    --text-dim: #8888a0;
    --bubble-user: #2a2a4a;
    --bubble-ai: #1e1e36;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  .header {
    background: var(--card);
    padding: 16px 20px;
    display: flex;
    align-items: center;
    gap: 12px;
    border-bottom: 2px solid var(--accent);
  }
  .header .logo {
    width: 40px; height: 40px;
    background: var(--accent);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px;
  }
  .header h1 { font-size: 16px; font-weight: 600; }
  .header .sub { font-size: 12px; color: var(--text-dim); }
  .header .mode {
    margin-left: auto;
    font-size: 11px;
    padding: 3px 8px;
    border-radius: 10px;
    background: #333;
    color: var(--text-dim);
  }
  .header .mode.llm { background: var(--accent); color: #000; }

  .chat {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    max-width: 600px;
    width: 100%;
    margin: 0 auto;
  }
  .msg {
    max-width: 85%;
    padding: 10px 14px;
    border-radius: 14px;
    font-size: 14px;
    line-height: 1.6;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .msg.user {
    align-self: flex-end;
    background: var(--bubble-user);
    border-bottom-right-radius: 4px;
  }
  .msg.ai {
    align-self: flex-start;
    background: var(--bubble-ai);
    border-bottom-left-radius: 4px;
  }
  .msg.ai::before {
    content: "🌸 ";
    font-size: 12px;
  }
  .msg.ai a { color: var(--accent); text-decoration: underline; word-break: break-all; }
  .typing {
    align-self: flex-start;
    padding: 10px 14px;
    background: var(--bubble-ai);
    border-radius: 14px;
    border-bottom-left-radius: 4px;
    font-size: 14px;
    color: var(--text-dim);
  }
  .typing .dot {
    display: inline-block;
    width: 6px; height: 6px;
    background: var(--text-dim);
    border-radius: 50%;
    margin: 0 2px;
    animation: bounce 1.2s infinite;
  }
  .typing .dot:nth-child(2) { animation-delay: .2s; }
  .typing .dot:nth-child(3) { animation-delay: .4s; }
  @keyframes bounce {
    0%, 80%, 100% { transform: translateY(0); opacity: .4; }
    40% { transform: translateY(-6px); opacity: 1; }
  }

  .input-area {
    background: var(--card);
    padding: 12px 16px;
    display: flex;
    gap: 8px;
    max-width: 600px;
    width: 100%;
    margin: 0 auto;
    border-top: 1px solid #2a2a3e;
  }
  .input-area input {
    flex: 1;
    background: var(--bg);
    border: 1px solid #333;
    border-radius: 10px;
    padding: 10px 14px;
    color: var(--text);
    font-size: 14px;
    outline: none;
  }
  .input-area input:focus { border-color: var(--accent); }
  .input-area button {
    background: var(--accent);
    color: #000;
    border: none;
    border-radius: 10px;
    padding: 10px 18px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  .input-area button:active { transform: scale(.95); }

  .quick {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    padding: 8px 16px 0;
    max-width: 600px;
    width: 100%;
    margin: 0 auto;
  }
  .quick span {
    background: #2a2a4a;
    color: var(--text);
    padding: 5px 12px;
    border-radius: 12px;
    font-size: 12px;
    cursor: pointer;
    transition: background .2s;
  }
  .quick span:hover { background: var(--accent2); }
</style>
</head>
<body>

<div class="header">
  <div class="logo">🌸</div>
  <div>
    <h1>小桃养成记 · AI 客服</h1>
    <div class="sub">有问题随时问～</div>
  </div>
  <span class="mode" id="mode">检测中…</span>
</div>

<div class="quick" id="quick">
  <span data-q="下载链接在哪？">📥 下载</span>
  <span data-q="怎么登录？">🔐 登录</span>
  <span data-q="存档怎么同步？">💾 存档</span>
  <span data-q="游戏结局有哪些？">🎮 结局</span>
  <span data-q="手机闪退了怎么办？">🐛 闪退</span>
</div>

<div class="chat" id="chat">
  <div class="msg ai">你好呀！我是小桃养成记的 AI 客服 🌸
你可以问我游戏下载、安装、登录、存档、游戏内容等问题～</div>
</div>

<div class="input-area">
  <input type="text" id="input" placeholder="输入你的问题…" autocomplete="off">
  <button onclick="send()">发送</button>
</div>

<script>
const chat = document.getElementById("chat");
const input = document.getElementById("input");

// Quick questions
document.getElementById("quick").addEventListener("click", e => {
  const s = e.target.closest("span[data-q]");
  if (s) { input.value = s.dataset.q; send(); }
});

// Enter to send
input.addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); } });

async function send() {
  const msg = input.value.trim();
  if (!msg) return;
  input.value = "";

  // User bubble
  addMsg("user", msg);

  // Typing indicator
  const typing = document.createElement("div");
  typing.className = "typing";
  typing.innerHTML = '<span class="dot"></span><span class="dot"></span><span class="dot"></span>';
  chat.appendChild(typing);
  chat.scrollTop = chat.scrollHeight;

  try {
    const resp = await fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message: msg }),
    });
    const data = await resp.json();
    typing.remove();
    addMsg("ai", data.reply);
    updateMode(data.mode);
  } catch (e) {
    typing.remove();
    addMsg("ai", "抱歉，网络出了点问题，请稍后再试 🥺");
  }
}

function addMsg(type, text) {
  const div = document.createElement("div");
  div.className = "msg " + type;
  if (type === "ai") {
    // Basic HTML: links
    div.innerHTML = text.replace(/(https?:\/\/\S+)/g, '<a href="$1" target="_blank">$1</a>')
                        .replace(/\n/g, "<br>");
  } else {
    div.textContent = text;
  }
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

async function updateMode(mode) {
  const el = document.getElementById("mode");
  if (mode === "llm") {
    el.textContent = "🧠 LLM";
    el.classList.add("llm");
  } else {
    el.textContent = "⚡ 规则";
    el.classList.remove("llm");
  }
}

// Check health
fetch("/api/health").then(r => r.json()).then(d => updateMode(d.mode)).catch(() => {});
</script>
</body>
</html>
